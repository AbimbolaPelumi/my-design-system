name: Sync design tokens

on:
  repository_dispatch:
    types: [zeroheight_tokens_updated]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run token sync
        env:
          ZEROHEIGHT_API_TOKEN: ${{ secrets.ZEROHEIGHT_API_TOKEN }}
          ZEROHEIGHT_STYLEGUIDE_ID: ${{ secrets.ZEROHEIGHT_STYLEGUIDE_ID }}
        run: npm run sync-tokens

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/token-sync-${{ github.run_number }}
          title: "chore: sync design tokens from Zeroheight"
          body: |
            Automated token sync from Zeroheight.
            
            Review the diff in `tokens/output/variables.css` and `tokens/output/tokens.ts` 
            before merging to ensure no unintended visual changes.
          commit-message: "chore: sync design tokens from Zeroheight"
          labels: tokens, automated